name: CI

# The first CI this repository has had. Its ~250 tests have never run on a runner, and the
# package supports five target frameworks, so the matrix is the support matrix: a TFM that
# cannot build and pass its tests is a TFM we should not be publishing for.
#
# fail-fast is false on purpose - one broken TFM must not hide the state of the other four.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest   # net472 needs the .NET Framework targeting pack and runtime
    strategy:
      fail-fast: false
      matrix:
        framework: [ net472, net6.0, net8.0, net9.0, net10.0 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Reignite.Optimizely.Counters.slnx

      - name: Build (${{ matrix.framework }})
        run: dotnet build Reignite.Optimizely.Counters.slnx -c Release -f ${{ matrix.framework }} --no-restore

      - name: Test (${{ matrix.framework }})
        run: dotnet test Reignite.Optimizely.Counters.slnx -c Release -f ${{ matrix.framework }} --no-build
